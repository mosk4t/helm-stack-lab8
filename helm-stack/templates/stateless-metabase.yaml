apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase
  template:
    metadata:
      labels:
        app: metabase
    spec:
      containers:
      - name: metabase
        image: metabase/metabase:latest
        ports:
        - containerPort: 3000
        env:
        - name: MB_DB_TYPE
          value: "postgres"
        - name: MB_DB_HOST
          value: {{ if .Values.postgresql.enabled }}"postgres-svc"{{ else }}{{ .Values.externalDatabase.host | quote }}{{ end }}
        - name: MB_DB_PORT
          value: "5432"
        - name: MB_DB_DBNAME
          value: "scoot_hunt"
        - name: MB_DB_USER
          value: {{ .Values.externalDatabase.user | quote }}
        - name: MB_DB_PASS
          value: {{ .Values.externalDatabase.password | quote }}